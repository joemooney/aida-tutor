title: Codex-only onboarding accepts unselected Antigravity scaffold
description: 'When a learner selects only Codex in aida-tutor onboard, current AIDA 0.14 may still create .antigravity/ during aida init --agent codex. The tutor should not quietly accept unselected agent scaffold directories. It should fail the init checkpoint when .antigravity/ exists and Antigravity was not selected, with guidance to remove it or rerun once upstream strict allow-list behavior is fixed. Parent: STORY-50.'
