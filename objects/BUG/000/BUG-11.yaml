  author: joe
  content: 'Implemented: shell-mode next guidance is now context-aware. When aida-tutor shell is already in workspace/, Next action blocks omit the redundant cd line and do not embed a next command; the shell footer handles the follow-up instruction. Top-level cargo run -- next still keeps cd/cd .. guidance. Added a regression test for the shell step-2 nudge. Verified with cargo fmt --check, cargo test, and a scripted shell transcript through init/blocker/cleanup.'
