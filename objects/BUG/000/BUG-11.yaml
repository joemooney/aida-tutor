title: Shell next guidance repeats cd and next
description: 'In aida-tutor shell, the Next action block is rendered as if the user were outside the shell: it includes cd /path/to/workspace even when the shell prompt is already in workspace/, and it embeds a next command even though the footer already says to type next after the action. Make shell-mode guidance context-aware and non-redundant.'
