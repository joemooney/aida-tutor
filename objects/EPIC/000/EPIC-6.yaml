title: Refresh tutor for AIDA 0.14 project setup flows
description: |-
  AIDA 0.14 has expanded first-run and project-enablement behavior beyond the tutor's current framing. The tutor should explicitly teach how to start a new project with AIDA and how to enable AIDA in an existing project, including the current init choices, agent scaffolding, and remote/sync posture.

  Primary callers: terminal learner using aida-tutor; maintainer running cargo run -- demo; docs reader evaluating whether AIDA fits their project.

  Acceptance:
  - The README and welcome/current overview describe the current 36-exercise track plus onboarding path instead of the stale 17-exercise map.
  - The setup narrative distinguishes a brand-new project, an existing git repo, a non-git directory using --git-init, a markdown-only --minimal first run, and full git-canonical init.
  - The enablement narrative names the scaffolded agent surfaces for 0.14: CLAUDE.md/.claude, AGENTS.md/.codex skills, .antigravity where applicable, .mcp.json, hooks, roles, and machine-level agent posture.
  - The path to sharing/deploying a new AIDA-backed project includes remote setup, aida push/pull, and the orphan store branch, without implying users must manage requirements.db.
  - cargo test and cargo run -- reset --yes && cargo run -- demo pass against the installed aida 0.14 CLI.
