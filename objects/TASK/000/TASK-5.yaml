title: Fix non-TTY Git linkage verifier drift
description: |-
  The end-to-end demo currently fails exercise 7 against aida 0.14 because the verifier shells out to aida show in a non-TTY context, where AIDA defaults to compact TOON output that omits the human Git linkage block. Manual aida show FR-1 --format human does show the linkage.

  Primary callers: cargo run -- demo in CI/non-TTY; terminal learner running aida-tutor verify; exercise 7 verifier.

  Acceptance:
  - Exercise 7 passes under cargo run -- reset --yes && cargo run -- demo against aida 0.14.
  - The verifier either pins aida show --format human when checking for the Git linkage block or accepts a stable machine-readable linkage signal.
  - Learner-facing text still matches what an interactive terminal user sees.
  - cargo test passes.
