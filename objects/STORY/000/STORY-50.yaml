title: Onboarding agent selection controls scaffolded agents
description: |-
  Update aida-tutor onboard so agent selection is compliance-safe: users can select one or more allowed agents, and the Step 1 aida init command scaffolds only those selected agents when AIDA supports that shape. A user selecting only Codex must not be instructed to run plain aida init that scaffolds Claude.

  Primary callers: terminal learner at an employer where some agents are prohibited; learner selecting only Codex; learner selecting multiple allowed agents; non-interactive cargo run -- onboard --reset smoke runs.

  Acceptance:
  - Onboarding presents agent selection as allowed scaffold targets, not only the Step 3 implementer.
  - Selecting only Codex renders aida init --agent codex and no Claude-specific scaffold expectation in the setup guidance.
  - Selecting only Claude renders aida init --agent claude.
  - Selecting multiple supported agents renders the appropriate broad scaffold command; if AIDA only supports both for claude+codex, the copy explains that limitation clearly.
  - Manual/human remains available for implementation, but does not imply any prohibited agent scaffold.
  - The persisted onboarding state records selected scaffold agents and primary implementer.
  - cargo fmt --check, cargo test, cargo run -- onboard --reset, and cargo run -- reset --yes && cargo run -- demo pass.
