  content: 'Root cause confirmed: ADR-66 / STORY-1473 (aida b602a5d, 2026-10-04) deliberately removed ambient authority (env role, bare TTY, roster-as-seat). Only validated seat grants confer authority: eval "$(aida role enter advisor --delegate-seat implementer)" at a human TTY exports AIDA_SESSION_GRANT. Impacts learners too (core ex 2 approved status, ex 8 aida done). Plan: (1) teach role enter in the core right after init; rewrite ex 22 to the grant model. (2) demo drops set_var(AIDA_SESSION_ROLE) and requires an inherited AIDA_SESSION_GRANT, failing fast with the eval command; implementer steps (6, 24, 29) use a delegated child grant. (3) Do NOT forge grant records like aida''s test fixture. (4) demo is no longer headless-CI-capable; a headless issuance path would be an AIDA-side spec. First check: can a delegated implementer child grant be entered non-interactively?'
