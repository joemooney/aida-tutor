  content: 'Implemented: onboarding footer now prints a Next action block with concrete commands. Step 1 distinguishes missing init from initialized-but-blocked state and names unselected scaffold directories such as .antigravity, including cleanup and rerun commands. Step 2 now prints the exact aida add command instead of prose. Verified with cargo fmt --check, cargo test, Codex-only blocked/cleanup smoke, and full cargo run -- reset --yes && cargo run -- demo.'
