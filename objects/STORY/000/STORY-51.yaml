title: Onboarding explains blocked checkpoints interactively
description: Improve aida-tutor onboard so learners are not left at a generic step footer after running the instructed command. When a checkpoint is blocked by a known condition such as an unselected agent scaffold directory, the screen should say exactly what was found and what command to run next. The onboarding footer should also present the next command as an actionable prompt instead of a passive 'run again' loop.
