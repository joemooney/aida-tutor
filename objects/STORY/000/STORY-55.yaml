title: Add interactive onboarding shell
description: Add an aida-tutor shell command that starts an interactive tutorial prompt. It should seed/select onboarding state, start in workspace/, execute normal shell commands, preserve cd as a built-in, support next/lesson/where/reset/exit built-ins, and re-run onboarding checkpoint verification after each command. When progress advances, it should print the completed step and current next action so the learner can demonstrate a single terminal flow.
