  content: 'Implemented: added aida-tutor shell as an interactive onboarding shell. It starts in workspace/, supports built-ins next/lesson/where/reset/help/exit plus cd, executes other input through sh -c from the shell''s current directory, and re-runs onboarding checkpoint verification after each external command. The shell announces completed steps automatically and prints shell-native next actions, including blocker diagnostics for unselected scaffold directories. README now recommends shell as the first-run path. Verified with cargo fmt --check, cargo test, top-level next smoke, scripted shell transcript through init/blocker/cleanup/add, and full cargo run -- reset --yes && cargo run -- demo.'
