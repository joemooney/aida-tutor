title: Teach new-project bootstrap paths for AIDA 0.14
description: |-
  Add a focused new-project setup path to aida-tutor. It should show the practical choices a user faces before first capture: create a git repo separately or let aida init --git-init do it, start with --minimal for a markdown-only trial, or run full git-canonical aida init for the normal AIDA workflow.

  Primary callers: first-time terminal learner; docs reader starting a real project; cargo run -- demo.

  Acceptance:
  - Content teaches the recommended full path: mkdir/cd, git init or aida init --git-init, aida init --name <project>, first aida add, first trace/commit.
  - Content explicitly frames --minimal as a 60-second markdown-only trial that can be followed by full init later, not as the default production setup.
  - Content mentions --agent claude|codex|both and --no-skills only as setup choices, with default behavior matching current aida init help.
  - Verifier/demo exercises remain deterministic and pass non-interactively.
  - The text avoids deprecated centralized/requirements.db language except as a legacy opt-out warning if mentioned at all.
