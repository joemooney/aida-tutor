title: Display active AIDA project name or parent aida-store in banner
description: The launchpad banner info lines must dynamically display the active AIDA project or inherited parent directory aida-store instead of hardcoded mock paths. When inside an AIDA project root, display the project name and branch; when in a child directory using a parent aida-store, clearly display the parent aida-store or project name; when outside any AIDA project, indicate no AIDA project is active.
