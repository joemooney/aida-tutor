title: Context-aware AIDA launchpad menu with init flow
description: The interactive AIDA launchpad shall detect whether the target directory is an initialized AIDA project. When uninitialized, agent, status, and shell options are hidden and an init option is presented. Selecting init initializes AIDA directly if .git exists, or prompts to initialize the current directory or create a new project subdirectory if no git repository exists.
