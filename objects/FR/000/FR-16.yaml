title: Show shimmering AIDA launch banner
description: The interactive AIDA launchpad shall begin with a Rust-rendered shimmering AIDA terminal banner and display the active menu or prompt beneath it. The shimmer must stop on the first user keystroke, return that keystroke to the caller without losing it, restore terminal state and cursor visibility, and allow the caller to continue normal menu or prompt input.
