title: Organize FAQ into hierarchical topics
description: The FAQ should be organized as a navigable hierarchy of top-level topics such as new user, tutor, architecture, configuration, workflow, autonomy, and troubleshooting, with nested subtopics where useful. The interactive menu should let a learner choose a topic, browse its questions, open details, and return to the parent level with Esc. FAQ data should remain file-backed and validate references.
