title: Add generalized AIDA launchpad menu
description: The default aida-tutor interface shall provide a top-level AIDA launchpad with Agent, Status, Shell, Help/Tutorials, and Exit options. Agent invokes aida agent new; Status opens an extensible status submenu; Shell provides an aida> command prompt that executes entered AIDA commands with arguments; Help/Tutorials opens the existing tutorial menu. Direct CLI commands remain available for scripting.
